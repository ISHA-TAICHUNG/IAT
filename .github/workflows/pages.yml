name: Publish Practice Site
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      retryDepth:
        description: Revision-change rebuild attempt
        default: '0'
        type: string
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate frontend
        run: |
          for file in js/*.js sw.js; do node --check "$file"; done
          node --test tests/load-reliability.test.js tests/practice-ux.test.js tests/snapshot-publication.test.mjs
      - name: Build validated public snapshot
        id: build
        run: node tools/build_public_snapshot.mjs "$RUNNER_TEMP/site"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
      - name: Verify source immediately before deploy
        # artifact 已完整上傳後，再檢查原始題庫版本；失敗不切換正式站。
        id: before
        run: node tools/verify_public_snapshot.mjs "$RUNNER_TEMP/site"
      - name: Deploy
        id: deploy
        if: ${{ success() }}
        uses: actions/deploy-pages@v4
      - name: Verify published snapshot
        id: after
        if: ${{ success() }}
        run: node tools/verify_public_snapshot.mjs "$RUNNER_TEMP/site" --public
      - name: Rebuild after source change or transient publication failure
        if: ${{ failure() && (steps.build.outputs.rebuild_required == 'true' || steps.before.outputs.rebuild_required == 'true' || steps.after.outputs.rebuild_required == 'true') }}
        uses: actions/github-script@v7
        env:
          RETRY_DEPTH: ${{ inputs.retryDepth || '0' }}
        with:
          script: |
            const depth = Number(process.env.RETRY_DEPTH);
            if (!Number.isInteger(depth) || depth < 0 || depth >= 2) throw new Error('Snapshot verification requires manual attention');
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner, repo: context.repo.repo,
              workflow_id: 'pages.yml', ref: 'main', inputs: { retryDepth: String(depth + 1) }
            });
