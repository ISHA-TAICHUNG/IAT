<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>作答中 — 管理職類測驗線上練習</title>
    <meta name="description" content="管理職類測驗線上作答頁面" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css?v=20260502a" />
</head>

<body>
    <header class="site-header">
        <div class="inner">
            <div class="header-logo-wrap">
                <img src="images/logo-header.png" alt="ISHA" class="header-logo-img" />
            </div>
            <div>
                <h1 id="exam-title" data-i18n="exam.loading">載入中…</h1>
                <p class="header-sub" data-i18n="site.subtitle">職業安全衛生 — 即測即評</p>
            </div>
            <button class="fontsize-btn" onclick="cycleFontSize()" title="字體大小">A</button>
            <button class="theme-toggle" onclick="toggleTheme()" title="切換深色模式" data-i18n="theme.dark">🌙</button>
        </div>
    </header>

    <div class="exam-header">
        <div class="inner">
            <div class="exam-meta">
                <span data-i18n="exam.q.prefix">第 </span><strong id="q-current">1</strong><span data-i18n="exam.q.of"> 題 / 共 </span><strong id="q-total">80</strong><span data-i18n="exam.q.unit"> 題</span>
            </div>
            <div class="progress-bar-wrap">
                <div class="progress-bar-fill" id="progress-bar" style="width:0%"></div>
            </div>
            <div class="exam-meta">
                <span data-i18n="exam.answered">已答</span> <strong id="answered-count">0</strong> <span data-i18n="mode.questions">題</span>
            </div>
            <div class="timer" id="timer" style="display:none">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
                    <circle cx="12" cy="12" r="10" />
                    <path d="M12 6v6l4 2" />
                </svg>
                <span id="timer-text">80:00</span>
            </div>
            <button class="btn-end-early" id="btn-end" onclick="endEarly()" data-i18n="exam.btn.end">提前結束</button>
        </div>
    </div>

    <div id="main-area">
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p data-i18n="exam.loading">載入題庫中…</p>
        </div>
    </div>

    <!-- 提前結束確認 Modal -->
    <div class="modal-backdrop" id="end-confirm-modal" role="dialog" aria-modal="true">
        <div class="modal">
            <div class="notice-icon warning" style="margin-bottom:12px">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    style="width:26px;height:26px">
                    <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" />
                    <line x1="12" y1="9" x2="12" y2="13" />
                    <line x1="12" y1="17" x2="12.01" y2="17" />
                </svg>
            </div>
            <h3 style="text-align:center;margin-bottom:8px" data-i18n="endmodal.title">確定要提前結束？</h3>
            <p style="text-align:center;color:var(--gray-500);font-size:.88rem;margin-bottom:20px" data-i18n="endmodal.body">
                尚未作答的題目將不計分，確定要結束並查看成績嗎？</p>
            <div class="modal-actions" style="justify-content:center">
                <button class="btn btn-outline" onclick="closeEndConfirm()" data-i18n="endmodal.continue">繼續作答</button>
                <button class="btn btn-primary" style="background:var(--danger)" onclick="confirmEnd()" data-i18n="endmodal.confirm">確定結束</button>
            </div>
        </div>
    </div>

    <!-- 反饋 Modal -->
    <div class="modal-backdrop" id="feedback-modal">
        <div class="modal">
            <h3 data-i18n="fb.title">💬 題目反饋</h3>
            <label data-i18n="fb.type">反饋類型</label>
            <select id="fb-type">
                <option value="題目有誤" data-i18n="fb.type.q">題目有誤</option>
                <option value="答案有誤" data-i18n="fb.type.a">答案有誤</option>
                <option value="選項有誤" data-i18n="fb.type.o">選項有誤</option>
                <option value="其他" data-i18n="fb.type.other">其他</option>
            </select>
            <label data-i18n="fb.desc">補充說明（選填）</label>
            <textarea id="fb-desc" placeholder="請描述問題…" data-i18n="fb.placeholder"></textarea>
            <div class="modal-actions">
                <button class="btn btn-outline" onclick="closeFeedback()" data-i18n="fb.cancel">取消</button>
                <button class="btn btn-primary" onclick="submitFeedback()" data-i18n="fb.submit">送出</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <!-- 圖片放大 Modal -->
    <div class="image-modal" id="image-modal" onclick="closeImageModal()">
        <img id="modal-image" alt="放大圖片">
        <div class="image-modal-hint" data-i18n="image.modal.hint">點擊任意處關閉</div>
    </div>

    <script src="js/config.js?v=20260502a"></script>
    <script src="js/i18n.js?v=20260502a"></script>
    <script src="js/utils.js?v=20260502a"></script>
    <script src="js/exam.js?v=20260502a"></script>
</body>

</html>
