<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>成績結果 — 管理職類測驗線上練習</title>
    <meta name="description" content="管理職類測驗成績結果頁面" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css?v=20260222a" />
</head>

<body>
    <header class="site-header">
        <div class="inner">
            <div class="header-logo-wrap">
                <img src="images/logo-header.png" alt="中華民國工業安全衛生協會" class="header-logo-img" />
            </div>
            <div>
                <h1>測驗成績</h1>
                <p class="header-sub">職業安全衛生 — 即測即評</p>
            </div>
            <button class="theme-toggle" onclick="toggleTheme()" title="切換深色模式">🌙</button>
        </div>
    </header>

    <main class="container">
        <div id="result-area">
            <div class="loading">
                <div class="spinner"></div>
                <p>計算中…</p>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <img src="images/logo.png" alt="ISHA" class="footer-logo-img" />
        <div class="footer-org">社團法人中華民國工業安全衛生協會附設台中職業訓練中心</div>
        <div>管理職類暨即測即評線上練習系統</div>
    </footer>

    <!-- 反饋 Modal -->
    <div class="modal-backdrop" id="result-fb-modal">
        <div class="modal">
            <h3>💬 題目反饋</h3>
            <label>反饋類型</label>
            <select id="result-fb-type">
                <option value="題目有誤">題目有誤</option>
                <option value="答案有誤">答案有誤</option>
                <option value="選項有誤">選項有誤</option>
                <option value="其他">其他</option>
            </select>
            <label>補充說明（選填）</label>
            <textarea id="result-fb-desc" placeholder="請描述問題…"></textarea>
            <div class="modal-actions">
                <button class="btn btn-outline" onclick="closeResultFeedback()">取消</button>
                <button class="btn btn-primary" onclick="submitResultFeedback()">送出</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="js/config.js?v=20260222a"></script>
    <script src="js/utils.js?v=20260222a"></script>
    <script src="js/result.js?v=20260222a"></script>
</body>

</html>
